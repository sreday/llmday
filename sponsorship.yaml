tiers:
  - id: leads
    name: "Conference Leads"
    highlight: false
    requires: "Requires another sponsorship tier"
    price:
      small: 1000
      medium: 1000
      large: 1000
    benefits:
      - "Full attendee contact list, shared pre/post"
      - "Has to be purchased on top of another opportunity"

  - id: booth
    name: "Booth / Table"
    highlight: true
    price:
      small: 500
      medium: 2000
      large: 4000
    benefits:
      - "Table (150 x 100cm) with a 24-inch monitor"
      - "Electricity, Wifi, space for a rollup banner"

  - id: keynote
    name: "Keynote Session"
    highlight: false
    price:
      small: 1000
      medium: 3000
      large: 5000
    benefits:
      - "30-minute morning slot"
      - "100% audience — no parallel talks"

  - id: talk
    name: "Regular Session Slot"
    highlight: false
    price:
      small: 1500
      medium: 2000
      large: 2000
    benefits:
      - "30-minute afternoon slot"
      - "May run with parallel tracks"

  - id: logo_swag
    name: "Website Sponsor + Swag"
    highlight: false
    price:
      small: 500
      medium: 1000
      large: 1000
    benefits:
      - "Logo on website, on-stage mention"
      - "Swag distribution to all attendees"

  - id: food
    name: "Breakfast / Coffee / Lunch / Happy Hour"
    highlight: false
    price_label: "£1000 + £15 pp"
    benefits:
      - "Microphone time before the break"
      - "Distributing your swag along food & beverages"

  - id: clothing
    name: "Branded clothing"
    highlight: false
    price_label: "£1000 + £10–30pp"
    benefits:
      - "T-shirts, socks, hoodies or caps with your big logo"
      - "variable pricing depending on the item"

  - id: tickets
    name: "Discounted Ticket Pack"
    highlight: false
    price_label: "20% off 5+ tickets"
    benefits:
      - "Cheaper tickets when 5+ are purchased"
      - "Vouchers redeemable by anyone"

  - id: startup_discount
    name: "Startup Discount"
    highlight: false
    price_label: "20% off any opportunity"
    benefits:
      - "Early-stage startups under $5M in funding"
      - "Contact us to apply"

