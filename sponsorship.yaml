tiers:
  - id: leads
    name: "Conference Leads"
    highlight: false
    requires: "Cannot be purchased solo"
    price:
      small: 500
      medium: 1000
      large: 1000
    benefits:
      - "Full attendee contact list, shared before & after"

  - id: keynote
    name: "Keynote Session"
    highlight: false
    price:
      small: 1000
      medium: 3000
      large: 5000
    benefits:
      - "30-minute morning slot"
      - "100% audience — no parallel talks"

  - id: talk
    name: "Regular Session Slot"
    highlight: false
    price:
      small: 500
      medium: 2000
      large: 2000
    benefits:
      - "30-minute afternoon slot"
      - "May run alongside parallel tracks"

  - id: booth
    name: "Booth / Table"
    highlight: false
    price:
      small: 1000
      medium: 2000
      large: 4000
    benefits:
      - "Table (150 × 100cm) with a 24-inch monitor"
      - "Electricity, Wi-Fi, space for a rollup banner"

  - id: logo_swag
    name: "Website Sponsor + Swag"
    highlight: false
    price:
      small: 500
      medium: 1000
      large: 1000
    benefits:
      - "Logo on website, on-stage mention"
      - "Swag distributed to all attendees"

  - id: food
    name: "Breakfast / Coffee / Lunch / Happy Hour"
    highlight: false
    price_label: "£1000 + £15pp"
    benefits:
      - "Microphone time before the break"
      - "Distribute your swag alongside food & drinks"

  - id: clothing
    name: "Branded Wearables"
    highlight: false
    price_label: "£1000 + variable"
    benefits:
      - "T-shirts, socks, hoodies or caps with your logo"
      - "£10–£30 per person, depending on the item"

  - id: tickets
    name: "Discounted Ticket Pack"
    highlight: false
    price_label: "20% off 5+ tickets"
    benefits:
      - "Buy 5 or more tickets at 20% off"
      - "Vouchers redeemable by anyone"

  - id: startup_discount
    name: "Startup Discount"
    highlight: false
    price_label: "20% off anything"
    benefits:
      - "Early-stage startups under $5M in funding"
      - "Contact us to apply"

#on request:

  - id: host
    name: "Bring the conference to your city"
    highlight: false
    price_label: "On request"

  - id: co_located
    name: "Co-Located Event"
    highlight: false
    price_label: "On request"

  - id: workshop
    name: "Workshop"
    highlight: false
    price_label: "On request"

  - id: hackathon
    name: "Hackathon"
    highlight: false
    price_label: "On request"

  - id: meetup
    name: "Post-Conference Meetup"
    highlight: false
    price_label: "On request"

  - id: email_blast
    name: "Attendee Email Blast"
    highlight: false
    price_label: "On request"
