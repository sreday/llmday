<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Live - {{ brand_name }} {{ city_name }}</title>
<!-- /<event>/live/: the schedule as it happens, for a screen at the venue. Built by _build/live.py from the same
     schedule as the event page; runs on the viewer's clock. ?at=10:40 tries it at another time. -->
<style>
  :root { --accent: {{ brand_color or '#713660' }}; --bg: #0d1117; --card: #161b22; --line: #2d333b; --ink: #f5f7fa; --muted: #9aa4b2; --warn: #f5b84a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; padding: 2.2vh 2.4vw; gap: 2vh; min-height: 100vh;
    background: radial-gradient(120% 80% at 0% 0%, color-mix(in srgb, var(--accent) 38%, transparent), transparent 60%), var(--bg); }
  header { display: flex; align-items: center; gap: 1.4vw; }
  .live { display: inline-flex; align-items: center; gap: .6vw; padding: .5vh 1vw; border-radius: 999px; background: #e5484d;
    font-weight: 800; font-size: clamp(14px, 1.5vw, 30px); letter-spacing: .08em; }
  .live::before { content: ""; width: .8vw; height: .8vw; min-width: 8px; min-height: 8px; border-radius: 50%; background: #fff; animation: blink 1.4s infinite; }
  .live.off { background: var(--line); }
  .live.off::before { animation: none; opacity: .5; }
  @keyframes blink { 50% { opacity: .2; } }
  .event { flex: 1; min-width: 0; font-weight: 800; font-size: clamp(18px, 2.2vw, 44px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event small { color: var(--muted); font-weight: 600; margin-left: .8vw; font-size: .7em; }
  .clock { font-weight: 800; font-size: clamp(28px, 4.2vw, 84px); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  #fs { font: inherit; font-weight: 700; font-size: clamp(12px, 1.1vw, 20px); color: var(--ink); background: var(--line); border: 0; border-radius: 999px; padding: 1vh 1.4vw; cursor: pointer; }
  #fs:hover { background: #3b434d; }
  :fullscreen #fs { display: none; }
  main { flex: 1; display: flex; flex-direction: column; gap: 2vh; min-height: 0; }
  h2 { margin: 0; font-size: clamp(14px, 1.5vw, 30px); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 800; }
  .grid { flex: 1; display: grid; gap: 1.4vw; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); min-height: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 1.6vw; padding: 2.4vh 1.6vw; display: flex; flex-direction: column; gap: 1.6vh; min-width: 0; }
  .room { font-weight: 800; font-size: clamp(14px, 1.45vw, 30px); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .pill { align-self: flex-start; padding: .4vh .8vw; border-radius: 999px; font-weight: 800; font-size: clamp(11px, 1.05vw, 22px); text-transform: uppercase; letter-spacing: .08em;
    background: color-mix(in srgb, var(--accent) 55%, #000); }
  .pill.workshop { background: #1f6f5c; }
  .pill.break { background: #3b434d; }
  .title { font-weight: 800; line-height: 1.15; font-size: var(--tsize, clamp(20px, 2.5vw, 56px)); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .who { display: flex; align-items: center; gap: 1vw; font-size: clamp(14px, 1.6vw, 34px); font-weight: 600; }
  .who img { width: 6vh; height: 6vh; border-radius: 50%; object-fit: cover; flex: none; background: var(--line); }
  .who span { min-width: 0; }
  .who b { display: block; }
  .who i { font-style: normal; color: var(--muted); }
  .spacer { flex: 1; }
  .bar { height: 2.2vh; min-height: 10px; border-radius: 999px; background: #2a313a; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); background: color-mix(in srgb, var(--accent) 70%, #fff); transition: width 1s linear; }
  .left { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 1vw; font-weight: 800; }
  .left b { font-size: clamp(22px, 3vw, 64px); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .left span { white-space: nowrap; }
  .left span { color: var(--muted); font-size: clamp(13px, 1.3vw, 28px); font-weight: 700; }
  .soon .bar i { background: var(--warn); }
  .soon .left b { color: var(--warn); }
  .next { border-top: 1px solid var(--line); padding-top: 1.4vh; font-size: clamp(13px, 1.35vw, 28px); color: var(--muted); font-weight: 600; }
  .next b { color: var(--ink); }
  .next .nt { color: var(--ink); font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .idle .title { color: var(--muted); }
  /* A break for everyone: one big card. */
  .hero { flex: 1; justify-content: center; text-align: center; align-items: center; padding: 4vh 4vw; }
  .hero .pill { align-self: center; }
  .hero .title { font-size: clamp(36px, 6vw, 140px); }
  .hero .where { color: var(--muted); font-size: clamp(18px, 2.4vw, 52px); font-weight: 700; }
  .hero .bar { width: 70%; height: 3vh; }
  .hero .left { width: 70%; }
  .hero .left b { font-size: clamp(30px, 4.6vw, 100px); }
  /* Before / between days: a countdown and the first sessions. */
  .count { font-weight: 800; font-size: clamp(36px, 7vw, 160px); line-height: 1; font-variant-numeric: tabular-nums; }
  .list { display: flex; flex-direction: column; border-radius: 1.6vw; overflow: hidden; border: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 9vw minmax(0, 1fr) auto; align-items: center; gap: 1.6vw; padding: 1.8vh 1.6vw; background: var(--card); border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .hm { font-weight: 800; font-size: clamp(18px, 2.4vw, 52px); font-variant-numeric: tabular-nums; }
  .row .rt { font-weight: 800; font-size: clamp(16px, 2vw, 44px); line-height: 1.2; }
  .row .rw { color: var(--muted); font-size: clamp(13px, 1.4vw, 30px); font-weight: 600; margin-top: .4vh; }
  .row .rr { color: var(--muted); font-size: clamp(12px, 1.2vw, 26px); font-weight: 700; text-align: right; }
  .row.brk .rt { color: var(--muted); }
  footer { display: flex; justify-content: space-between; gap: 2vw; color: var(--muted); font-weight: 700; font-size: clamp(13px, 1.4vw, 30px); }
  footer b { color: var(--ink); }
  .try { color: var(--warn); }
  @media (max-width: 800px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .row { grid-template-columns: 64px minmax(0, 1fr); }
    .row .rr { grid-column: 2; text-align: left; }
    .card { border-radius: 16px; padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <span class="live" id="liveTag">LIVE</span>
  <div class="event">{{ brand_name }} {{ city_name }}<small>{{ date_string }}</small></div>
  <div class="clock" id="clock">--:--</div>
  <button id="fs" type="button">Full screen</button>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<script id="live-data" type="application/json">{{ live_json | safe }}</script>
<script>
(function () {
  let D = JSON.parse(document.getElementById('live-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const T = (iso) => Date.parse(iso);

  // ?at=10:40 or ?at=2026-11-02T10:40 (event time): run from then, for trying it out.
  let shift = 0;
  const at = new URLSearchParams(location.search).get('at');
  if (at) {
    const first = (D.days[0] && D.days[0][0] && D.days[0][0].items[0]) ? D.days[0][0].items[0].start.slice(0, 10) : new Date().toISOString().slice(0, 10);
    const m = (/T/.test(at) ? at : first + 'T' + at).match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d?):(\d\d)/);
    if (m) shift = Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) - D.offset * 60000 - Date.now();
  }
  const now = () => Date.now() + shift;
  const hm = (ms) => { const d = new Date(ms + D.offset * 60000); return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
  function span(ms) {
    const m = Math.max(0, Math.ceil(ms / 60000));
    if (m < 60) return m + ' min';
    const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), r = m % 60;
    return d ? d + (d === 1 ? ' day ' : ' days ') + h + ' h' : h + ' h' + (r ? ' ' + r + ' min' : '');
  }

  // The day on now: the one running, else the next one, else the last.
  function bounds(day) {
    let s = Infinity, e = -Infinity;
    for (const r of day) for (const it of r.items) { s = Math.min(s, T(it.start)); if (!it.wrap) e = Math.max(e, T(it.end)); }
    return [s, e];
  }
  function pickDay(t) {
    for (let i = 0; i < D.days.length; i++) { const [, e] = bounds(D.days[i]); if (t < e) return i; }
    return D.days.length - 1;
  }

  const KIND = { keynote: 'Keynote', talk: 'Talk', workshop: 'Workshop', break: 'Break' };
  function who(it) {
    if (!it.who) return '';
    const img = it.photo ? '<img src="' + esc(it.photo) + '" alt="" onerror="this.remove()">' : '';
    return '<div class="who">' + img + '<span><b>' + esc(it.who) + '</b>' + (it.org ? '<i>' + esc(it.org) + '</i>' : '') + '</span></div>';
  }
  function progress(it, t, big) {
    const s = T(it.start), e = T(it.end), left = e - t;
    const pct = Math.min(100, Math.max(0, (t - s) / Math.max(1, e - s) * 100));
    return '<div class="spacer"></div><div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="left"><b>' + span(left) + ' left</b><span>until ' + esc(it.end_hm) + '</span></div>';
  }
  const soon = (it, t) => T(it.end) - t <= 5 * 60000;
  function nextLine(it) {
    if (!it) return '';
    return '<div class="next"><b>Next ' + esc(it.hm) + '</b>' + (it.kind === 'break' ? ' · ' + esc(it.title) : '') +
      (it.kind !== 'break' ? '<div class="nt">' + esc(it.title) + '</div>' + (it.who ? esc(it.who) : '') : '') + '</div>';
  }
  function rowHTML(it, room) {
    return '<div class="row' + (it.kind === 'break' ? ' brk' : '') + '"><div class="hm">' + esc(it.hm) + '</div><div><div class="rt">' + esc(it.title) + '</div>' +
      (it.who ? '<div class="rw">' + esc(it.who) + (it.org ? ' · ' + esc(it.org) : '') + '</div>' : it.where ? '<div class="rw">' + esc(it.where) + '</div>' : '') +
      '</div><div class="rr">' + (it.kind === 'break' ? '' : esc(room || '')) + '</div></div>';
  }
  // Everything in a day in time order, a break shared by the rooms once.
  function merged(day) {
    const seen = new Set(), all = [];
    for (const r of day) for (const it of r.items) {
      const k = it.start + '|' + it.title;
      if (it.kind === 'break' && seen.has(k)) continue;
      seen.add(k);
      all.push(Object.assign({ room: r.room }, it));
    }
    return all.sort((a, b) => T(a.start) - T(b.start));
  }

  function render() {
    const t = now();
    if (!D.days.length) { $('main').innerHTML = '<h2>No schedule yet</h2>'; return; }
    const di = pickDay(t), day = D.days[di], [ds, de] = bounds(day);
    const multi = D.days.length > 1 ? 'Day ' + (di + 1) + ' · ' : '';
    $('liveTag').className = 'live' + (t >= ds && t < de ? '' : ' off');
    let html = '';
    let foot = '';

    if (t < ds) {
      // Before the day: when it starts, and the first sessions.
      const all = merged(day).filter((it) => !it.wrap).slice(0, 5);
      html = '<h2>' + multi + 'Starts in</h2><div class="count">' + span(ds - t) + '</div><h2>First up</h2><div class="list">' +
        all.map((it) => rowHTML(it, D.days[di].length > 1 ? it.room : '')).join('') + '</div>';
    } else if (t >= de) {
      html = '<div class="card hero"><div class="title">That\'s a wrap!</div><div class="where">Thanks for coming to ' + esc(D.event) + '</div></div>';
    } else {
      const rooms = day.map((r) => {
        const items = r.items.filter((it) => !it.wrap);
        return { room: r.room, cur: items.find((it) => T(it.start) <= t && t < T(it.end)), next: items.find((it) => T(it.start) > t) };
      });
      const curs = rooms.filter((r) => r.cur).map((r) => r.cur);
      const allBreak = curs.length > 0 && curs.every((c) => c.kind === 'break' && c.title === curs[0].title);
      if (allBreak) {
        const b = curs[0];
        html = '<div class="card hero' + (soon(b, t) ? ' soon' : '') + '"><span class="pill break">Break</span><div class="title">' + esc(b.title) + '</div>' +
          (b.where ? '<div class="where">' + esc(b.where) + '</div>' : '') + progress(b, t, true) + '</div>';
        const after = rooms.filter((r) => r.next && r.next.kind !== 'break');
        if (after.length) {
          html += '<h2>Right after</h2><div class="list">' + after.map((r) => rowHTML(r.next, after.length > 1 ? r.room : '')).join('') + '</div>';
        }
      } else {
        // A card per room with something on now (a keynote alone gets the
        // whole screen); a room with nothing on yet shows when its next
        // session is, as a card if nothing is on anywhere, else in a list.
        const on = rooms.filter((r) => r.cur);
        const shown = on.length ? on : rooms.filter((r) => r.next);
        const tsize = shown.length > 2 ? ';--tsize:clamp(18px,2vw,46px)' : shown.length === 1 ? ';--tsize:clamp(28px,4.4vw,96px)' : '';
        html = '<div class="grid" style="--cols:' + Math.min(shown.length, 4) + tsize + '">' + shown.map((r) => {
          const c = r.cur;
          if (!c) {
            return '<div class="card idle"><div class="room">' + esc(r.room) + '</div><span class="pill break">Next at ' + esc(r.next.hm) + '</span>' +
              '<div class="title">' + esc(r.next.title) + '</div>' + who(r.next) + '<div class="spacer"></div><div class="left"><b>in ' + span(T(r.next.start) - t) + '</b></div></div>';
          }
          return '<div class="card' + (soon(c, t) ? ' soon' : '') + '"><div class="room">' + esc(r.room) + '</div><span class="pill ' + c.kind + '">' + KIND[c.kind] + '</span>' +
            '<div class="title">' + esc(c.title) + '</div>' + (c.kind === 'break' && c.where ? '<div class="who">' + esc(c.where) + '</div>' : who(c)) +
            progress(c, t) + nextLine(r.next) + '</div>';
        }).join('') + '</div>';
        const later = on.length ? rooms.filter((r) => !r.cur && r.next && r.next.kind !== 'break' && T(r.next.start) - t < 60 * 60000) : [];
        if (later.length) html += '<h2>Coming up in the other rooms</h2><div class="list">' + later.map((r) => rowHTML(r.next, r.room)).join('') + '</div>';
      }
      // The next break everyone shares, for the footer.
      const nb = merged(day).find((it) => it.kind === 'break' && !it.wrap && T(it.start) > t);
      if (nb) foot = '<span>Next break: <b>' + esc(nb.title) + '</b> at <b>' + esc(nb.hm) + '</b> (in ' + span(T(nb.start) - t) + ')</span>';
      const wrap = merged(day).find((it) => it.wrap);
      if (wrap) foot += '<span>Wrap up at <b>' + esc(wrap.hm) + '</b></span>';
    }
    if (shift) foot += '<span class="try">Trying it at ' + hm(t) + ' (?at=)</span>';
    $('main').innerHTML = html;
    $('foot').innerHTML = foot;
  }
  function clock() { $('clock').textContent = hm(now()); }

  // A schedule change deployed during the day: picked up without a reload
  // (a reload would leave full screen).
  async function refresh() {
    try {
      const r = await fetch(location.pathname, { cache: 'no-store' });
      const m = (await r.text()).match(/<script id="live-data" type="application\/json">([\s\S]*?)<\/script>/);
      if (m) { D = JSON.parse(m[1]); render(); }
    } catch (e) {}
  }

  $('fs').addEventListener('click', () => {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement) d.exitFullscreen();
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') $('fs').click(); });
  render();
  clock();
  setInterval(clock, 1000);
  setInterval(render, 5000);
  setInterval(refresh, 5 * 60000);
})();
</script>
</body>
</html>
