# start time includes timezone at the end relative to UTC
start_time: "2026-11-17T09:00:00+02:00"
# before - no schedule
# active - schedule
# after  - hide ticket sales
event_state: before
date_string: "November 17, 2026"
location_string: "Microsoft Reactor, Tel Aviv, Israel"
city_name: "Tel Aviv"
calendly_sponsor_url: "https://calendly.com/sreday/30min"
# get this from the event url
# get this from the event url (empty until the Luma event exists = "Tickets will be available soon")
luma_evt:
in10t_event: eqasup     # registration on in10t.ai (Sharone), shown instead of Luma in the Tickets section
registration_free: true   # the in10t tickets are free (with approval): no discount codes on this event
cfp_url: https://cfp.ninja/e/llmday-2026-tel-aviv-q4

# the number of tracks needs to be the same per day
# the tracks will be taken in the order they appear in the CSV file
days: 1
attendees: 150
speakers: 10+
tracks: 1

rooms:
- main room

# mirrors the in10t agenda (https://in10t.ai/llmday-dataday-tlv): doors 09:00, opening 09:45,
# brunch 11:30, quick break 13:30, panel 13:45, lunch 14:30-15:15 (talks themselves stay 30 min here)
breaks:
- title: Registration & coffee
  duration: 45
  comment: Main lobby
  # this decides how many talks in-between this and previous section
  talks_before: 0
- title: Brunch break
  duration: 30
  comment: Main lobby
  talks_before: 5
- title: Quick break
  duration: 15
  comment: Main lobby
  talks_before: 2
- title: Panel
  duration: 45
  comment: Main room
  talks_before: 0
- title: Lunch
  duration: 45
  comment: Main lobby
  talks_before: 0

