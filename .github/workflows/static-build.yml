name: Build and Deploy

# ── DEPLOY SWITCH ─────────────────────────────────────────────────────────────────────────────────────────
# If the site stops updating, or the Actions tab shows a red ❌ on the "Deploy" step, switch back to the old,
# slower deploy:
#   1. On github.com, open this file (.github/workflows/static-build.yml) and click the pencil icon (Edit).
#   2. Below, change   FAST_DEPLOY: 'true'   to   FAST_DEPLOY: 'false'   (keep the quotes).
#   3. Click "Commit changes...", then "Commit changes".
# That's all. The site redeploys with the old action a few minutes later. Change it back to 'true' to undo.
env:
  FAST_DEPLOY: 'true'

on:
  push:
    branches:
      - main
    paths-ignore:   # notes that are not part of the site do not deploy
      - '**/README.md'
      - '.claude/**'
  schedule:
    - cron: '10 4 * * *'   # daily ~5AM UK (04:10 UTC) so /status/ is fresh before work
  workflow_dispatch:
    inputs:
      clear_cache:
        description: Rebuild every optimised image and teaser PNG from scratch
        type: boolean
        default: false
permissions:
  contents: write
  actions: write   # the render job queues one more deploy when it drew new pictures
# Deploys queue (Marek 2026-10-09): the running one always lands, a newer push replaces the waiting one. A deploy stays under
# 5 minutes: it never renders pictures - the render job after it does, and queues one more deploy when it drew any.
# The queue is per job, not per run: a deploy waits only for another deploy, never for a render job (up to 40 minutes)
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy   # its own name: the old workflow-wide queue was also "static-build"
      cancel-in-progress: false   # queue, never cancel: a running deploy always lands; a newer push replaces the waiting one (Marek 2026-10-09)
    timeout-minutes: 15   # deploys queue now: a hung one must not hold the site for GitHub's default 6 hours
    steps:
      - name: Start the clock
        run: echo "T0=$(date +%s)" >> $GITHUB_ENV

      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: History for /status/ speaker log
        run: git fetch --no-tags --shallow-since="$(date -u -d '45 days ago' +%F)" origin ${{ github.ref_name }}

      - name: Pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('_build/requirements.txt') }}

      - name: Deps
        run: |
          make --version
          make deps

      # Content-addressed cache of optimised images and teaser PNGs (and finished events' Luma hero rows, read by the build): an entry is reused only when
      # every input that produced it is byte-identical, so a cached result can never be stale.
      - name: Restore image and teaser cache
        if: ${{ !inputs.clear_cache }}
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-

      - name: Remember the cache as restored
        run: mkdir -p .cache && touch .cache/.restored && find .cache -type f | sort > /tmp/cache-before.txt

      - name: Build 🔧
        env:
          LUMA_API_KEYS: ${{ secrets.LUMA_API_KEYS }}   # one or more Luma calendar keys, comma-separated; /status/ registrations
          WAITLIST_FEED: ${{ secrets.WAITLIST_FEED }}   # "Speaker waitlist" script exec URL + ?list=1&token=...; /status/ Waitlist tab
          COMMUNITYHERO_FEED: ${{ secrets.COMMUNITYHERO_FEED }}   # "Community hero" script exec URL + ?list=1&token=...; /status/ Heroes tab
        run: |
          make clean
          make -j4 generate   # 4 events at a time (the runner has 4 cores); each builds in its own folder

      - name: Optimize Images
        run: python _build/optimize_images.py --prune

      - name: Teaser PNGs from the cache
        run: python _build/render_teasers.py --cached-only   # renders nothing: a picture not drawn yet stays absent (the page draws it, slime-checked)

      # every page's link preview: a <250 KB 1200 px JPEG per picture (static/og/<hash>.jpg), full og/twitter tag set,
      # fallback to the event/home picture, redirect stubs take their target's preview; never fails the build
      - name: Link preview pictures and tags
        run: python _build/og_images.py --prune

      # Pages use the .webp siblings optimize_images.py wrote, asset URLs get ?v=<content hash>
      # (a changed file always gets a new URL; HTML itself is never cached long), images lazy-load
      - name: WebP, versioned asset URLs, lazy images
        run: python _build/rewrite_assets.py

      - name: Page weight report
        continue-on-error: true   # report only: lists first-view/full-scroll bytes and any missing files
        run: python _build/page_weight.py static/index.html static/20*/index.html

      - name: Did the cache change
        id: cache
        if: always()
        run: |
          find .cache -type f | sort > /tmp/cache-after.txt
          # A cache hit only refreshes its entry's last-used time (os.utime, for --prune), so "anything newer than the restore"
          # was true on every push and the ~5 GB cache went up again each time (~40-60 s). Entries are content-addressed, so a
          # real change adds or removes files; the only in-place rewrite is a finished event's Luma hero rows. Last-used times
          # still reach the cache at least every 3 days (.saved), well inside the 14-day prune window.
          if ! cmp -s /tmp/cache-before.txt /tmp/cache-after.txt \
             || [ -n "$(find .cache/luma-heroes -type f -newer .cache/.restored 2>/dev/null | head -1)" ] \
             || [ -z "$(find .cache/.saved -mtime -3 2>/dev/null)" ]; then
            touch .cache/.saved
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Save image and teaser cache
        if: always() && steps.cache.outputs.changed == 'true'   # an unchanged cache is not uploaded again (it took ~1 min)
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}

      # Fast deploy: static/ goes out as one fresh commit on gh-pages (it keeps only the live site, not every past version -
      # the repo had grown to GBs). The live branch is fetched without file contents (seconds, where the old deploy action
      # downloaded the whole site, ~1 min on SREday) and the push sends only new or changed files. The live CNAME is kept
      # when static/ has none, as the old action did; an unchanged site is not pushed again.
      # FAST_DEPLOY at the top of this file switches between this step and the old one below.
      - name: Deploy 🚀
        if: env.FAST_DEPLOY == 'true'
        env:
          GH_PAGES_TOKEN: ${{ github.token }}
        run: |
          export GIT_DIR=$RUNNER_TEMP/pages/.git GIT_WORK_TREE=$PWD/static GIT_INDEX_FILE=$RUNNER_TEMP/pages.index
          git init -q "$RUNNER_TEMP/pages"
          printf '.github/\n.ssh/\n' > "$GIT_DIR/info/exclude"   # left out, as the old deploy action did
          git remote add origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${{ github.repository }}.git"
          old=""
          if git fetch -q --filter=blob:none --depth=1 origin gh-pages; then old=$(git rev-parse FETCH_HEAD); fi
          git -c core.looseCompression=0 add -A   # stored uncompressed on this throwaway machine (the push still compresses):
                                                  # most files are images, and compressing them again took ~40 s on SREday
          if [ ! -e static/CNAME ] && [ -n "$old" ] && cname=$(git rev-parse -q --verify "$old:CNAME"); then
            git update-index --add --cacheinfo "100644,$cname,CNAME"
          fi
          tree=$(git write-tree)
          if [ -n "$old" ] && [ "$tree" = "$(git rev-parse "$old^{tree}")" ]; then echo "Nothing changed: the live site is already this build"; exit 0; fi
          commit=$(git -c user.name="${{ github.actor }}" -c user.email="${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com" \
            commit-tree "$tree" -m "Deploying to gh-pages from @ ${{ github.repository }}@${{ github.sha }} 🚀")
          git push -q --force origin "$commit:refs/heads/gh-pages"
          echo "Deployed $commit"

      # Old deploy action, used only when FAST_DEPLOY at the top of this file is 'false'.
      - name: Deploy 🚀 (old action)
        if: env.FAST_DEPLOY != 'true'
        uses: JamesIves/github-pages-deploy-action@v4.4.0
        with:
          branch: gh-pages
          folder: static
          single-commit: true   # gh-pages keeps only the live site, not every past version (the repo had grown to GBs)

      - name: Build time
        if: always()
        run: |
          t=$(( $(date +%s) - T0 )); m=$(( t / 60 )); sec=$(( t % 60 ))
          if [ $t -gt 300 ]; then echo "::warning::Deploy took ${m}m${sec}s - over the 5-minute limit"; s="⚠️ over the 5-minute limit"; else s="✅ within 5 minutes"; fi
          echo "### Deploy: ${m}m${sec}s $s" >> $GITHUB_STEP_SUMMARY

  # the pictures, after the deploy (Marek 2026-10-09): real Chrome draws what the deploy did not have - new or changed cards
  # only, 4 at a time, slime-checked - saves them to the cache and queues one more deploy to publish them; when it drew
  # nothing (the usual case, and always after that extra deploy) it stops there
  render-teasers:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40   # a first full redraw of every picture fits; whatever it drew is saved even when it stops
    concurrency:
      group: teaser-render
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('_build/requirements.txt') }}

      - name: Deps
        run: make deps

      - name: Restore image and teaser cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: site-cache-render-${{ github.run_id }}
          restore-keys: site-cache-

      - name: Build 🔧
        env:
          LUMA_API_KEYS: ${{ secrets.LUMA_API_KEYS }}   # one or more Luma calendar keys, comma-separated; /status/ registrations
          WAITLIST_FEED: ${{ secrets.WAITLIST_FEED }}   # "Speaker waitlist" script exec URL + ?list=1&token=...; /status/ Waitlist tab
          COMMUNITYHERO_FEED: ${{ secrets.COMMUNITYHERO_FEED }}   # "Community hero" script exec URL + ?list=1&token=...; /status/ Heroes tab
        run: |
          make clean
          make -j4 generate   # the same pages the deploy built, so the cache keys match

      - name: Optimize Images
        run: python _build/optimize_images.py   # as in the deploy: the cards' keys hash the optimised files they use

      - name: Render teaser PNGs
        id: render
        run: python _build/render_teasers.py --jobs 4 --prune   # headless Chrome (preinstalled on the runner); never fails

      - name: Save image and teaser cache
        if: always() && steps.render.outputs.rendered != '0'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: site-cache-render-${{ github.run_id }}

      - name: Publish the new pictures
        if: steps.render.outputs.rendered != '0' && steps.render.outputs.rendered != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static-build.yml --ref ${{ github.ref_name }}
