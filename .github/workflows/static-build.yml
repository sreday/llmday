name: Build and Deploy
on:
  push:
    branches:
      - main
  schedule:
    - cron: '10 4 * * *'   # daily ~5AM UK (04:10 UTC) so /status/ is fresh before work
  workflow_dispatch:
    inputs:
      clear_cache:
        description: Rebuild every optimised image and teaser PNG from scratch
        type: boolean
        default: false
permissions:
  contents: write
# Every run rebuilds the whole site, so only the newest one needs to finish
concurrency:
  group: static-build
  cancel-in-progress: false   # queue, never cancel: a running deploy always lands; a newer push replaces the waiting one (Marek 2026-10-09)
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2.3.1

      - name: History for /status/ speaker log
        run: git fetch --no-tags --shallow-since="$(date -u -d '45 days ago' +%F)" origin ${{ github.ref_name }}

      - name: Deps
        run: |
          make --version
          make deps

      - name: Build 🔧
        env:
          LUMA_API_KEYS: ${{ secrets.LUMA_API_KEYS }}   # one or more Luma calendar keys, comma-separated; /status/ registrations
          WAITLIST_FEED: ${{ secrets.WAITLIST_FEED }}   # "Speaker waitlist" script exec URL + ?list=1&token=...; /status/ Waitlist tab
          COMMUNITYHERO_FEED: ${{ secrets.COMMUNITYHERO_FEED }}   # "Community hero" script exec URL + ?list=1&token=...; /status/ Heroes tab
        run: |
          make clean
          make generate

      # Content-addressed cache of optimised images and teaser PNGs: an entry is reused only when
      # every input that produced it is byte-identical, so a cached result can never be stale.
      - name: Restore image and teaser cache
        if: ${{ !inputs.clear_cache }}
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-

      - name: Optimize Images
        run: python _build/optimize_images.py --prune

      - name: Render teaser PNGs
        run: python _build/render_teasers.py --prune   # headless Chrome (preinstalled on the runner); never fails the build

      # every page's link preview: a <250 KB 1200 px JPEG per picture (static/og/<hash>.jpg), full og/twitter tag set,
      # fallback to the event/home picture, redirect stubs take their target's preview; never fails the build
      - name: Link preview pictures and tags
        run: python _build/og_images.py --prune

      # Pages use the .webp siblings optimize_images.py wrote, asset URLs get ?v=<content hash>
      # (a changed file always gets a new URL; HTML itself is never cached long), images lazy-load
      - name: WebP, versioned asset URLs, lazy images
        run: python _build/rewrite_assets.py

      - name: Page weight report
        continue-on-error: true   # report only: lists first-view/full-scroll bytes and any missing files
        run: python _build/page_weight.py static/index.html static/20*/index.html

      - name: Save image and teaser cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.4.0
        with:
          branch: gh-pages
          folder: static
