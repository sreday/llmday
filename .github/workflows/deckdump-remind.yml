name: Deck dump reminder

# Conference day, 12:00 local time (Marek 2026-11-27): ONE email to the speakers whose slides are not in the Deck dump
# yet. _build/deckdump_pull.py --remind (byte-identical in sreday, llmday, platformday and PEC) finds day 1 of an event
# between 12:00 and 15:59 local time, works out who has no deck (talk key, else speaker name, else a near-identical
# title) and posts the NAMES to the "Deck dump" Apps Script (llmday/_build/deckdump-form.gs, action "remind"). The
# script looks the addresses up in the WWW sheet, sends the email and never sends twice for one event, so the
# later hourly runs (a safety net for dropped GitHub cron runs) change nothing. Most runs stop after a second.
# Its own workflow: the hourly runs never queue behind (or cancel) a long "Deck dump" shipping run.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      event:
        description: Only this event folder (e.g. 2026-hamburg-q4)
        required: false
      now:
        description: Pretend it is this moment, for tests (e.g. 2026-11-18T12:10+01:00)
        required: false
      dry_run:
        description: Show who would get the email and its text, send nothing
        type: boolean
        default: true
      test_to:
        description: Send the one email to this team address only (mark@<brand>.com), not to speakers
        required: false
permissions:
  contents: read
concurrency:
  group: deckdump-remind
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deps
        run: pip install -q pyyaml

      - name: Remind
        env:
          DECKDUMP_FEED: ${{ secrets.DECKDUMP_FEED }}
          IN_EVENT: ${{ inputs.event }}
          IN_NOW: ${{ inputs.now }}
          IN_TEST_TO: ${{ inputs.test_to }}
        run: |
          args="--remind"
          if [ -n "$IN_EVENT" ]; then args="$args --event $IN_EVENT"; fi
          if [ -n "$IN_NOW" ]; then args="$args --now $IN_NOW"; fi
          if [ -n "$IN_TEST_TO" ]; then args="$args --test-to $IN_TEST_TO"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          python _build/deckdump_pull.py $args
