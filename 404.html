
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>LLMday - page not found</title>
  <script>
    (function () {
      var map = [{"from": "2026-redwood-city-q4", "to": "2026-san-francisco-q4"}];
      var p = location.pathname;
      for (var i = 0; i < map.length; i++) {
        var from = '/' + map[i].from + '/', to = '/' + map[i].to + '/';
        if (p.indexOf(from) === 0) { location.replace(to + p.slice(from.length) + location.search + location.hash); return; }
      }
    })();
  </script>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:700|Roboto:400&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #26986A; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: #f4f4f6; color: #111; font-family: 'Roboto', Arial, sans-serif; }
    main { width: 100%; max-width: 640px; padding: 40px 20px 60px; text-align: center; box-sizing: border-box; }
    .mascot { display: block; width: min(320px, 70vw); height: auto; margin: 0 auto 8px; animation: lost 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
    @keyframes lost { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .mascot { animation: none; } }
    .code { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: .9rem; letter-spacing: .12em; color: var(--accent); margin: 0 0 6px; }
    h1 { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: clamp(1.5rem, 5vw, 2.1rem); margin: 0 0 26px; }
    .back { display: inline-block; padding: 13px 30px; border-radius: 999px; background: var(--accent); color: #fff; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1rem; text-decoration: none; box-shadow: 0 6px 18px rgba(0,0,0,.18); transition: transform .15s, box-shadow .15s; }
    .back:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.24); }
  </style>
</head>
<body>
  <main>
    <img class="mascot" src="/assets/images/404.png" alt="" width="320">
    <p class="code">404</p>

</body>
</html>
