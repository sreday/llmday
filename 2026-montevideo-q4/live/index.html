": "2026-12-05T13:30:00-03:00", "end": "2026-12-05T14:30:00-03:00", "hm": "13:30", "end_hm": "14:30", "kind": "break", "title": "Lunch & Networking", "where": "Main lobby", "hello": false, "wrap": false}, {"start": "2026-12-05T14:30:00-03:00", "end": "2026-12-05T15:00:00-03:00", "hm": "14:30", "end_hm": "15:00", "kind": "talk", "title": "RAG Is Not a Search Problem", "who": "Leon Achata", "org": "TCS", "photo": "../../speakers/Leon Achata.png", "url": "../Leon_Achata_TCS_RAG_Is_Not_a_Search_Problem"}, {"start": "2026-12-05T15:00:00-03:00", "end": "2026-12-05T15:30:00-03:00", "hm": "15:00", "end_hm": "15:30", "kind": "talk", "title": "The AI Security Paradox: Quantifying Risk in the Age of LLMs and Agents", "who": "Federico Novelli", "org": "Protect Group", "photo": "../../speakers/Federico Novelli.png", "url": "../Federico_Novelli_Protect_Group_The_AI_Security_Paradox_Quantifying_Risk_in_the_Age_of_LLMs_and_Agent"}, {"start": "2026-12-05T15:30:00-03:00", "end": "2026-12-05T16:00:00-03:00", "hm": "15:30", "end_hm": "16:00", "kind": "talk", "title": "The Great AI Role Rewrite", "who": "Marcelo B San Martin", "org": "Blizzard Entertainment", "photo": "../../speakers/Marcelo B San Martin.png", "url": "../Marcelo_B_San_Martin_Blizzard_Entertainment_The_Great_AI_Role_Rewrite"}, {"start": "2026-12-05T16:00:00-03:00", "end": "2026-12-05T16:30:00-03:00", "hm": "16:00", "end_hm": "16:30", "kind": "break", "title": "Coffee Break & Networking", "where": "Main lobby", "hello": false, "wrap": false}, {"start": "2026-12-05T18:00:00-03:00", "end": "2026-12-05T18:00:00-03:00", "hm": "18:00", "end_hm": "18:00", "kind": "break", "title": "Wrap up", "where": "Scan each other's QR codes & head to a nearby pub!", "hello": false, "wrap": true}]}]]}</script>
<script>
(function () {
  let D = JSON.parse(document.getElementById('live-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const T = (iso) => Date.parse(iso);

  // ?at=10:40 or ?at=2026-11-02T10:40 (event time): run from then, for trying it out.
  let shift = 0;
  const at = new URLSearchParams(location.search).get('at');
  if (at) {
    const first = (D.days[0] && D.days[0][0] && D.days[0][0].items[0]) ? D.days[0][0].items[0].start.slice(0, 10) : new Date().toISOString().slice(0, 10);
    const m = (/T/.test(at) ? at : first + 'T' + at).match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d?):(\d\d)/);
    if (m) shift = Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) - D.offset * 60000 - Date.now();
  }
  const now = () => Date.now() + shift;
  const hm = (ms) => { const d = new Date(ms + D.offset * 60000); return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
  function span(ms) {
    const m = Math.max(0, Math.ceil(ms / 60000));
    if (m < 60) return m + ' min';
    const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), r = m % 60;
    return d ? d + (d === 1 ? ' day ' : ' days ') + h + ' h' : h + ' h' + (r ? ' ' + r + ' min' : '');
  }

  // The day on now: the one running, else the next one, else the last.
  function bounds(day) {
    let s = Infinity, e = -Infinity;
    for (const r of day) for (const it of r.items) { s = Math.min(s, T(it.start)); if (!it.wrap) e = Math.max(e, T(it.end)); }
    return [s, e];
  }
  function pickDay(t) {
    for (let i = 0; i < D.days.length; i++) { const [, e] = bounds(D.days[i]); if (t < e) return i; }
    return D.days.length - 1;
  }

  const KIND = { keynote: 'Keynote', talk: 'Talk', workshop: 'Workshop', break: 'Break' };
  function who(it) {
    if (!it.who) return '';
    const img = it.photo ? '<img src="' + esc(it.photo) + '" alt="" onerror="this.remove()">' : '';
    return '<div class="who">' + img + '<span><b>' + esc(it.who) + '</b>' + (it.org ? '<i>' + esc(it.org) + '</i>' : '') + '</span></div>';
  }
  function progress(it, t, big) {
    const s = T(it.start), e = T(it.end), left = e - t;
    const pct = Math.min(100, Math.max(0, (t - s) / Math.max(1, e - s) * 100));
    return '<div class="spacer"></div><div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="left"><b>' + span(left) + ' left</b><span>until ' + esc(it.end_hm) + '</span></div>';
  }
  const soon = (it, t) => T(it.end) - t <= 5 * 60000;
  function nextLine(it) {
    if (!it) return '';
    return '<div class="next"><b>Next ' + esc(it.hm) + '</b>' + (it.kind === 'break' ? ' · ' + esc(it.title) : '') +
      (it.kind !== 'break' ? '<div class="nt">' + esc(it.title) + '</div>' + (it.who ? esc(it.who) : '') : '') + '</div>';
  }
  function rowHTML(it, room) {
    return '<div class="row' + (it.kind === 'break' ? ' brk' : '') + (it.hello ? ' hello' : '') + '"><div class="hm">' + esc(it.hm) + '</div><div><div class="rt">' + esc(it.title) + '</div>' +
      (it.who ? '<div class="rw">' + esc(it.who) + (it.org ? ' · ' + esc(it.org) : '') + '</div>' : it.where ? '<div class="rw">' + esc(it.where) + '</div>' : '') +
      '</div><div class="rr">' + (it.kind === 'break' ? '' : esc(room || '')) + '</div></div>';
  }
  // Everything in a day in time order, a break shared by the rooms once.
  function merged(day) {
    const seen = new Set(), all = [];
    for (const r of day) for (const it of r.items) {
      const k = it.start + '|' + it.title;
      if (it.kind === 'break' && seen.has(k)) continue;
      seen.add(k);
      all.push(Object.assign({ room: r.room }, it));
    }
    return all.sort((a, b) => T(a.start) - T(b.start));
  }

  function render() {
    const t = now();
    if (!D.days.length) { $('main').innerHTML = '<h2>No schedule yet</h2>'; return; }
    const di = pickDay(t), day = D.days[di], [ds, de] = bounds(day);
    const multi = D.days.length > 1 ? 'Day ' + (di + 1) + ' · ' : '';
    $('liveTag').className = 'live' + (t >= ds && t < de ? '' : ' off');
    let html = '';
    let foot = '';

    if (t < ds) {
      // Before the day: when it starts, and the first sessions.
      const all = merged(day).filter((it) => !it.wrap).slice(0, 5);
      html = '<h2>' + multi + 'Starts in</h2><div class="count">' + span(ds - t) + '</div><h2>First up</h2><div class="list glass">' +
        all.map((it) => rowHTML(it, D.days[di].length > 1 ? it.room : '')).join('') + '</div>';
    } else if (t >= de) {
      html = '<div class="card glass hero"><div class="title">That\'s a wrap!</div><div class="where">Thanks for coming to ' + esc(D.event) + '</div></div>';
    } else {
      const rooms = day.map((r) => {
        const items = r.items.filter((it) => !it.wrap);
        return { room: r.room, cur: items.find((it) => T(it.start) <= t && t < T(it.end)), next: items.find((it) => T(it.start) > t) };
      });
      const curs = rooms.filter((r) => r.cur).map((r) => r.cur);
      const allBreak = curs.length > 0 && curs.every((c) => c.kind === 'break' && c.title === curs[0].title);
      if (allBreak) {
        const b = curs[0];
        html = '<div class="card glass hero' + (soon(b, t) ? ' soon' : '') + '"><span class="pill break">Break</span><div class="title">' + esc(b.title) + '</div>' +
          (b.where ? '<div class="where">' + esc(b.where) + '</div>' : '') + progress(b, t, true) + '</div>';
        const after = rooms.filter((r) => r.next && r.next.kind !== 'break');
        if (after.length) {
          html += '<h2>Right after</h2><div class="list glass">' + after.map((r) => rowHTML(r.next, after.length > 1 ? r.room : '')).join('') + '</div>';
        }
      } else {
        // A card per room with something on now (a keynote alone gets the
        // whole screen); a room with nothing on yet shows when its next
        // session is, as a card if nothing is on anywhere, else in a list.
        const on = rooms.filter((r) => r.cur);
        const shown = on.length ? on : rooms.filter((r) => r.next);
        const tsize = shown.length > 2 ? ';--tsize:clamp(18px,2vw,46px)' : shown.length === 1 ? ';--tsize:clamp(28px,4.4vw,96px)' : '';
        html = '<div class="grid" style="--cols:' + Math.min(shown.length, 4) + tsize + '">' + shown.map((r) => {
          const c = r.cur;
          if (!c) {
            return '<div class="card glass idle"><div class="room">' + esc(r.room) + '</div><span class="pill break">Next at ' + esc(r.next.hm) + '</span>' +
              '<div class="title">' + esc(r.next.title) + '</div>' + who(r.next) + '<div class="spacer"></div><div class="left"><b>in ' + span(T(r.next.start) - t) + '</b></div></div>';
          }
          return '<div class="card glass' + (soon(c, t) ? ' soon' : '') + '"><div class="room">' + esc(r.room) + '</div><span class="pill ' + c.kind + '">' + KIND[c.kind] + '</span>' +
            '<div class="title">' + esc(c.title) + '</div>' + (c.kind === 'break' && c.where ? '<div class="who">' + esc(c.where) + '</div>' : who(c)) +
            progress(c, t) + nextLine(r.next) + '</div>';
        }).join('') + '</div>';
        const later = on.length ? rooms.filter((r) => !r.cur && r.next && r.next.kind !== 'break' && T(r.next.start) - t < 60 * 60000) : [];
        if (later.length) html += '<h2>Coming up in the other rooms</h2><div class="list glass">' + later.map((r) => rowHTML(r.next, r.room)).join('') + '</div>';
      }
      // The next break everyone shares, for the footer.
      const nb = merged(day).find((it) => it.kind === 'break' && !it.wrap && T(it.start) > t);
      if (nb) foot = '<span>Next break: <b>' + esc(nb.title) + '</b> at <b>' + esc(nb.hm) + '</b> (in ' + span(T(nb.start) - t) + ')</span>';
      const wrap = merged(day).find((it) => it.wrap);
      if (wrap) foot += '<span>Wrap up at <b>' + esc(wrap.hm) + '</b></span>';
    }
    if (shift) foot += '<span class="try">Trying it at ' + hm(t) + ' (?at=)</span>';
    $('main').innerHTML = html;
    $('foot').innerHTML = foot;
  }
  function clock() { $('clock').textContent = hm(now()); }

  // A schedule change deployed during the day: picked up without a reload
  // (a reload would leave full screen).
  async function refresh() {
    try {
      const r = await fetch(location.pathname, { cache: 'no-store' });
      const m = (await r.text()).match(/<script id="live-data" type="application\/json">([\s\S]*?)<\/script>/);
      if (m) { D = JSON.parse(m[1]); render(); }
    } catch (e) {}
  }

  $('fs').addEventListener('click', () => {
    const d = document, el = d.documentElement;
    if (d.fullscreenElement) d.exitFullscreen();
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') $('fs').click(); });
  render();
  clock();
  setInterval(clock, 1000);
  setInterval(render, 5000);
  setInterval(refresh, 5 * 60000);
})();
</script>

)check(true)});addEventListener('pageshow',function(e){if(e.persisted)check(true)});setInterval(function(){check(false)},300000)})()</script>
