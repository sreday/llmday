{# ── Redirect stub written to static/<from>/index.html for renamed event folders (home/metadata.yml -> redirects).
     Keeps any sub-path: /<from>/talk.html -> /<to>/talk.html. ── #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ base_path }}{{ to }}/">
  <meta http-equiv="refresh" content="0; url=/{{ to }}/">
  <title>{{ brand_name }} - moved</title>
  <script>
    (function () {
      var from = '/{{ from }}/', to = '/{{ to }}/';
      var p = location.pathname;
      var rest = p.indexOf(from) === 0 ? p.slice(from.length) : '';
      location.replace(to + rest + location.search + location.hash);
    })();
  </script>
</head>
<body style="font-family:Arial,Helvetica,sans-serif;padding:40px;color:#111">
  <p>This event moved to <a href="/{{ to }}/">{{ base_path }}{{ to }}/</a>.</p>
</body>
</html>
