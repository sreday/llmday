<iframe
  id="luma-tickets-iframe"
  src="https://lu.ma/embed/event/{{ luma_evt }}/simple"
  width="100%"
  frameborder="0"
  style="border: 1px solid #bfcbda88; border-radius: 4px; display: block; min-height: 200px;"
  allowfullscreen=""
  aria-hidden="false"
  tabindex="0"
></iframe>

<a
  href="https://lu.ma/event/{{ luma_evt }}"
  class="luma-checkout--button"
  data-luma-action="checkout"
  data-luma-event-id="{{ luma_evt }}"
>
  Register on luma
</a>

<script id="luma-checkout" src="https://embed.lu.ma/checkout-button.js"></script>
<script>
  (function() {
    var params = window.location.search;
    var iframe = document.getElementById('luma-tickets-iframe');

    // Append query params to iframe src
    if (iframe && params) {
      var src = iframe.getAttribute('src');
      var sep = src.indexOf('?') > -1 ? '&' : '?';
      iframe.setAttribute('src', src + sep + params.substring(1));
    }

    // Append query params to button
    if (params) {
      var btn = document.querySelector('.luma-checkout--button');
      if (btn) {
        var href = btn.getAttribute('href');
        var sep = href.indexOf('?') > -1 ? '&' : '?';
        btn.setAttribute('href', href + sep + params.substring(1));
      }
    }

    // Auto-resize iframe via Luma postMessage
    window.addEventListener('message', function(e) {
      if (e.origin !== 'https://lu.ma') return;
      var d = e.data;
      if (d && typeof d.height === 'number') {
        iframe.style.height = d.height + 'px';
      }
    });
  })();
</script>
